name: Build and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet build ca.whittaker.Diagnostics.HttpRequestLogging.sln -c Release
      - run: dotnet test ca.whittaker.Diagnostics.HttpRequestLogging.sln -c Release --no-build
      - run: dotnet pack ca.whittaker.Diagnostics.HttpRequestLogging.sln -c Release --no-build -o artifacts
      - run: dotnet restore samples/HttpDiagnostics.Sample --source "$GITHUB_WORKSPACE/artifacts"
      - run: dotnet run --project samples/HttpDiagnostics.Sample -c Release --no-restore -- --self-test
